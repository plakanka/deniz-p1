<!doctype html>
<html lang="en" data-r="both" data-a="crop" data-b="exact" data-c="scrub">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Emine Deniz Akkaya, interior architect</title>
<meta name="description" content="Emine Deniz Akkaya, interior architect: walk through a house by a lake at night; her projects, skills and contact hang on its walls. İç mimar Emine Deniz Akkaya'nın portfolyosu.">
<meta name="theme-color" content="#0B1020">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta property="og:type" content="website">
<meta property="og:title" content="Emine Deniz Akkaya, interior architect">
<meta property="og:description" content="Walk through a house by a lake at night; her projects hang on its walls.">
<meta property="og:image" content="https://plakanka.github.io/deniz-p1/p1-enfilade/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,200..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/kit.css">
<link rel="stylesheet" href="style.css">
<script type="importmap">{ "imports": { "three": "../vendor/three.module.min.js" } }</script>
</head>
<body>
<div class="poster" aria-hidden="true"></div>
<canvas id="world" aria-hidden="true"></canvas>
<div class="veil" aria-hidden="true"></div>

<aside class="card" aria-hidden="true"></aside>

<header class="bar">
  <a class="bar-name" href="#top">Emine Deniz Akkaya</a>
  <nav aria-label="Rooms">
    <a href="#about" data-t="about">About</a><a href="#kolektif" data-t="work">Work</a><a href="#path" data-t="path">Skills</a><a href="#contact" data-t="contact">Contact</a>
    <button class="lang" type="button" id="lang"></button>
  </nav>
</header>

<main id="top">
  <!-- the only section drawn in HTML; everything after it hangs on a wall in the 3D house -->
  <section class="room hero" data-step="entrance" aria-label="Introduction">
    <p class="tag"><span>R.01</span><span class="t" data-t="entrance">Entrance</span></p>
    <h1 class="hero-name" id="name"></h1>
    <p class="hero-typer" id="typer"></p>
    <p class="hint" data-t="hint">Scroll to walk through the house</p>
  </section>

  <!-- Screen-reader copies of what is on the walls. They also set how long each stop lasts. -->
  <section class="ghost" id="about" data-step="about" aria-labelledby="about-h">
    <h2 id="about-h" data-t="about">About</h2>
    <p id="intro"></p>
    <dl id="facts"></dl>
  </section>
  <div id="work"></div>
  <section class="ghost" id="path" data-step="path" aria-labelledby="path-h">
    <h2 id="path-h" data-t="skills">Skills</h2>
    <dl id="skills"></dl>
    <h2 data-t="approach">How I work</h2>
    <ul id="principles"></ul>
  </section>
  <section class="ghost" id="contact" data-step="contact" aria-labelledby="contact-h">
    <h2 id="contact-h" data-t="contactTitle">Let's talk about a space.</h2>
    <p><a id="mail" href="#"></a></p>
    <ul id="links"></ul>
  </section>
</main>

<script src="../shared/content.js"></script>
<script type="module">
  import "./page.js";
  // the 3D house needs WebGL 2; without it (or if it fails to start) the sections are shown as a plain page over the still
  const gl = (() => { try { return !!document.createElement("canvas").getContext("webgl2"); } catch { return false; } })();
  const plain = () => document.documentElement.classList.add("no-gl");
  if (gl) import("./main.js").catch((e) => { console.error(e); plain(); }); else plain();
</script>
</body>
</html>
